<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../estilos/style_login.css">
</head>
<body>
    <header>
        <a href="#" id="ajuda">Precisa de ajuda?</a>
    </header>
    <main>
        <div id="tela">
            <h1 style="color: rgb(3, 20, 95); font-size: 28px;">BEM-VINDO!</h1>
            <p id="paratela">Entre ou Cadastre-se no site</p>
            <div id="campos">
                <p class="txtcampo">E-mail</p>
                <input class="campo" type="email" placeholder="Seu e-mail">
                <p class="txtcampo">Senha</p>
                <input class="campo" type="password" placeholder="Sua senha">
                <section id="recuperacao">
                    <label class="txtcamporec"><input type="checkbox"> Me lembre</label>
                    <a href="#" class="link">Esqueci minha senha</a>
                </section>
                <section id="btentrar"><a href="../textos/index_main.html" target="_self" >Entrar</a></section>
            </div>
            <hr>
            <p id="cadastro">Ainda não tem uma conta? <a href="#" class="link">Cadastre-se</a></p>
        </div>
        <p id="seguro">Seus dados estão seguros com a gente.</p>
    </main>
    <footer>
        <a href="#">Privacidade</a>
        <a href="#">Termos de uso</a>
    </footer>
</body>
</html>
